[project]
name = "ja-guard-hook"
version = "0.1.0"
description = "Claude Code の応答が英語に切り替わったとき、日本語で書き直させる Stop hook"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tsuka00" }]
requires-python = ">=3.9"
# 実行時の依存は持たない（docs/decisions/0002）
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "W",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "PT",  # flake8-pytest-style
  "TID", # flake8-tidy-imports
  "T20", # flake8-print
  "RUF", # ruff 固有
]
# 日本語のコメント・文字列で使う全角文字を、紛らわしい文字として扱わない
allowed-confusables = ["（", "）", "〇", "！", "？"]

# 標準入出力と環境変数は ja_guard/hook.py だけが扱う（判定ロジックを純関数に保つため）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "環境変数は ja_guard/hook.py で読み、ja_guard.config.load_thresholds に渡す"
"os.getenv".msg = "環境変数は ja_guard/hook.py で読み、ja_guard.config.load_thresholds に渡す"
"sys.stdin".msg = "標準入力は ja_guard/hook.py の main だけが読む"
"sys.stdout".msg = "標準出力は ja_guard/hook.py の main だけが書く"

# banned-api は組み込み関数に効かないため、print は T20 で禁止する
[tool.ruff.lint.per-file-ignores]
"ja_guard/hook.py" = ["TID251"]
"tests/**" = ["TID251", "T20"]

[tool.mypy]
# mypy は 3.9 を対象にできない。3.9 の互換性は ruff の target-version と CI の 3.9 実行で担保する
python_version = "3.10"
strict = true
files = ["main.py", "ja_guard", "tests"]
